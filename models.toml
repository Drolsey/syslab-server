# Step 4.7. Which model fills which role. An empty [roles.X] table means
# unavailable, never a silent fallback -- see app/models.py:model_for().
# This is a declaration, not the wire the app actually talks over: app/llm.py
# keeps reading LLM_BASE_URL / LLM_MODEL from .env via app/config.py exactly
# as it does today. The values below document today's deployment; nothing
# reads them into app/llm.py yet, because nothing needs two chat configs.
# The day a producer needs to ask "is embed available", this is what it asks.

[roles.chat]
model = "Qwen/Qwen3-14B-AWQ"
provider = "vllm"
context_tokens = 32768

# Step 5.4, 18 September 2026. app/vectors.py's EMBEDDINGS producer version
# is DERIVED from this whole table (a hash of it, sorted -- app/vectors.py's
# _embed_producer_version()), so any field changing here re-embeds every
# document automatically on the next process start. `revision` is here
# specifically because `model` alone is not enough for embeddings the way it
# is for chat: a same-name weights swap must invalidate stored vectors, and
# nothing else in this table would catch it -- see
# docs/plans/step-05-embeddings.md's deployment architecture review, § 6.
[roles.embed]
model = "Qwen/Qwen3-Embedding-0.6B"
provider = "vllm"
revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"

[roles.vision]
[roles.stt]
[roles.tts]
